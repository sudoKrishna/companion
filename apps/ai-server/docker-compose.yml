services:
  postgres:
    image: postgres:16
    container_name: companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion_dev_password
      POSTGRES_DB: companion
    ports:
      - "5432:5432"
    volumes:
      - companion_pg_data:/var/lib/postgresql/data

volumes:
  companion_pg_data:
